{% extends "base.html" %}
{% block title %}Edit Password #{{ entry.id }}{% endblock %}

{% block content %}
<h1>✏️ Edit Password Entry #{{ entry.id }}</h1>
<p><a href="{{ url_for('passwords', cat_id=entry.category_id) }}">&larr; Back to {{ entry.category.name }}</a></p>

<div class="card">
  <form method="post">
    <div class="form-group">
      <label for="username_email">Username / E-mail</label>
      <input type="text" id="username_email" name="username_email" class="form-control"
             value="{{ entry.username_email }}" required />
    </div>
    <div class="form-group">
      <label for="password">Password <small>(leave blank to keep current)</small></label>
      <input type="password" id="password" name="password" class="form-control"
             placeholder="New password or leave blank" />
      <small class="hint">
        Current password:
        <span id="current-pw-display">••••••••</span>
        <button type="button" id="show-current-pw" class="btn btn-xs btn-secondary">👁 Show</button>
      </small>
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <input type="text" id="notes" name="notes" class="form-control"
             value="{{ entry.notes or '' }}" />
    </div>
    <div class="form-group">
      <label for="allowed_roles">Allowed Role IDs <small>(comma-separated, blank = everyone)</small></label>
      <input type="text" id="allowed_roles" name="allowed_roles" class="form-control"
             value="{{ entry.allowed_roles or '' }}" />
    </div>
    <button type="submit" class="btn btn-primary">💾 Save Changes</button>
    <a href="{{ url_for('passwords', cat_id=entry.category_id) }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
  let revealed = false;
  document.getElementById('show-current-pw').addEventListener('click', async () => {
    const display = document.getElementById('current-pw-display');
    const btn = document.getElementById('show-current-pw');
    if (!revealed) {
      const resp = await fetch('/passwords/{{ entry.id }}/reveal', { method: 'POST' });
      if (!resp.ok) { display.textContent = '(error)'; return; }
      const data = await resp.json();
      display.textContent = data.password;
      btn.textContent = '🙈 Hide';
      revealed = true;
    } else {
      display.textContent = '••••••••';
      btn.textContent = '👁 Show';
      revealed = false;
    }
  });
</script>
{% endblock %}
